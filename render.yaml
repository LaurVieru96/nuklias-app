services:
  - type: web
    name: nuklias-backend
    runtime: node
    env: node
    region: frankfurt  # sau oregon, singapore - alege cel mai apropiat de utilizatori
    plan: free  # sau starter/standard pentru production
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Vei adăuga manual în Render Dashboard
      - key: SESSION_SECRET
        generateValue: true  # Render va genera automat
      - key: CLIENT_URL
        sync: false  # URL-ul frontend-ului tău (https://nuklias.netlify.app)
    healthCheckPath: /api/health
